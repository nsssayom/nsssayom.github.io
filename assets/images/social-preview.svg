<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Nazmus Shakib Sayom - Research Portfolio</title>
  <desc id="desc">Social preview card for Nazmus Shakib Sayom, PhD researcher in cyber-physical systems security and safety at the University of Utah.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset="1" stop-color="#141716"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#5eff43" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#5eff43" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#5eff43" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="portraitClip">
      <rect x="760" y="92" width="350" height="446" rx="42"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M88 542H572" stroke="#5eff43" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M88 120H548" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <path d="M96 170H500" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06"/>
  <circle cx="1010" cy="112" r="92" fill="#5eff43" opacity="0.06"/>
  <circle cx="1085" cy="480" r="140" fill="#5eff43" opacity="0.05"/>

  <g font-family="Space Grotesk, Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="88" y="116" fill="#5eff43" font-size="22" font-weight="600" letter-spacing="2">RESEARCH PORTFOLIO</text>
    <text x="88" y="218" fill="#f6f6f2" font-size="62" font-weight="600">Nazmus Shakib</text>
    <text x="88" y="288" fill="#f6f6f2" font-size="62" font-weight="600">Sayom</text>
    <text x="90" y="352" fill="#b8bbb7" font-size="28" font-weight="500">PhD Researcher | University of Utah</text>
    <text x="90" y="422" fill="#f1f2ef" font-size="34" font-weight="500">System Verification</text>
    <text x="90" y="474" fill="#a6aaa5" font-size="24" font-weight="400">Autonomous Systems Safety and Security</text>
    <text x="90" y="512" fill="#a6aaa5" font-size="24" font-weight="400">Cyber-Physical Systems Safety and Security</text>
    <text x="90" y="563" fill="#5eff43" font-size="24" font-weight="600">sayom.me</text>
  </g>

  <rect x="742" y="74" width="386" height="482" rx="58" fill="#5eff43" opacity="0.12" filter="url(#softShadow)"/>
  <rect x="760" y="92" width="350" height="446" rx="42" fill="#101311"/>
  <image href="sayom-ut.png" x="760" y="92" width="350" height="446" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)"/>
  <rect x="760" y="92" width="350" height="446" rx="42" fill="none" stroke="#5eff43" stroke-width="2" stroke-opacity="0.6"/>
</svg>
